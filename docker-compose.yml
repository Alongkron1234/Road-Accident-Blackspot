x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow
    # ให้ extractor/loader ต่อ Postgres จากข้างใน docker network (คนละค่ากับที่ host ใช้:
    # host ต่อผ่าน localhost:${POSTGRES_PORT} แต่ container ต่อผ่านชื่อ service "postgres" port 5432 ตรงๆ)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WAREHOUSE_DB: ${WAREHOUSE_DB}
    # ติดตั้ง dependency ที่ extract/*.py ต้องใช้ แต่ image apache/airflow ไม่มีมาให้
    # หมายเหตุ: pip install ทุกครั้งที่ container start ช้าขึ้นนิดหน่อย เหมาะกับ local dev เท่านั้น
    # ถ้าจะ production จริงควร build custom image แทน
    _PIP_ADDITIONAL_REQUIREMENTS: "tenacity==9.0.0 requests==2.32.3 psycopg2-binary==2.9.9 python-dotenv==1.0.1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./extract:/opt/airflow/extract
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # Issue 08: เปลี่ยนจาก postgres:16 ธรรมดา เป็น image ที่มี PostGIS ติดตั้งมาให้แล้ว
    # (ต้องใช้ ST_ClusterDBSCAN ทำ clustering แบบ SQL ล้วน) — เป็น image ทางการเดียวกันกับ
    # postgres:16 เป๊ะ แค่เพิ่ม extension มาให้ ไม่กระทบข้อมูลเดิมใน volume postgres_data เลย
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
